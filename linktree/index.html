<style>
/* Layout: one phone-width column on paper. Hero with portrait on a highlight disc, cobalt lead offer, white cards, charcoal footer. Deliberately single light theme (brand is paper-first). */
:root{
  --paper:#FAF9F6; --charcoal:#222222; --cobalt:#1E4EDB; --highlight:#FFF3A4; --white:#FFFFFF;
  --muted:#5B5D66; --rule:#E7E4DC;
  --display:"Inter","Inter Display",system-ui,-apple-system,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Marker Felt","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--charcoal);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:12px}

.mockbar{background:var(--charcoal);color:var(--white);font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:12px;align-items:center}
.mockbar span:last-child{color:var(--highlight)}

.page{max-width:460px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}

.top{display:flex;justify-content:space-between;align-items:center}
.top .logo svg{display:block;width:150px;height:auto}
.share{border:0;background:var(--white);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px}
.portrait{position:relative;width:132px;height:132px}
.portrait .disc{position:absolute;inset:0;border-radius:50%;background:var(--highlight)}
.portrait .ph{position:absolute;inset:10px 10px 0;border-radius:0 0 60px 60px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.portrait .ph svg{width:100%;height:auto}
.portrait .note{position:absolute;left:142px;top:22px;font-family:var(--hand);color:var(--cobalt);font-size:22px;transform:rotate(-8deg);white-space:nowrap;line-height:1}
.portrait .note svg{display:block;width:44px;margin:2px 0 0 -10px;transform:scaleX(-1) rotate(20deg)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cobalt)}
h1{font-family:var(--display);font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-0.02em;margin:0;text-wrap:balance}
.hl{position:relative;white-space:nowrap;z-index:0}
.hl::after{content:"";position:absolute;left:-4%;right:-4%;bottom:-2px;height:.42em;background:url("data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2268.000%22 height=%2226.000%22 preserveAspectRatio=%22none%22 viewBox=%22-1.000 -1.000 68.000 26.000%22%3E%3Cpath id=%22artwork-1%22 d=%22M 18.996,19.992 C 15.678,20.417 12.314,20.629 9.009,20.689 C 8.019,20.707 7.035,20.712 5.991,20.672 C 5.294,20.646 4.570,20.600 3.970,20.354 C 3.362,20.104 2.883,19.649 2.636,19.057 C 2.389,18.465 2.377,17.735 2.343,17.016 C 2.295,15.958 2.201,14.922 2.369,13.978 C 2.478,13.360 2.700,12.782 3.039,12.244 C 3.311,11.813 3.657,11.408 3.968,10.948 C 4.333,10.407 4.648,9.790 5.068,9.379 C 6.030,8.440 7.543,8.585 8.987,8.581 C 10.367,8.577 11.683,8.437 13.007,8.298 C 18.938,7.679 25.013,7.097 30.999,6.132 C 33.671,5.701 36.326,5.194 39.010,4.904 C 41.992,4.581 45.011,4.526 48.011,4.329 C 49.348,4.240 50.681,4.124 51.984,3.822 C 53.325,3.510 54.634,3.002 56.003,2.931 C 58.341,2.809 60.853,3.962 61.886,6.022 C 63.150,8.544 62.194,12.427 59.896,13.816 C 58.797,14.480 57.391,14.573 56.023,14.840 C 55.009,15.039 54.016,15.332 53.013,15.550 C 50.045,16.194 46.989,16.170 43.990,16.533 C 41.301,16.858 38.657,17.493 35.978,17.905 C 32.677,18.414 29.324,18.586 26.008,18.995 C 23.666,19.284 21.343,19.692 18.996,19.992 Z%22 fill=%22%23FFF3A4%22 fill-rule=%22evenodd%22%3E%3C/path%3E%3C/svg%3E") center/100% 100% no-repeat;z-index:-1}
.bio{margin:0;color:var(--muted);font-size:16px;max-width:36ch}

.socials{display:flex;gap:10px;flex-wrap:wrap}
.socials a{width:48px;height:48px;border-radius:50%;background:var(--white);display:grid;place-items:center;transition:transform .15s}
.socials a:hover{transform:translateY(-2px)}
.socials svg{width:22px;height:22px;color:var(--charcoal)}

/* sections */
.section{display:flex;flex-direction:column;gap:12px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}

.card{display:flex;flex-direction:column;gap:6px;background:var(--white);border-radius:24px;padding:22px;cursor:pointer;border:0;text-align:left;width:100%;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:active{transform:scale(.99)}
.card .k{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--cobalt)}
.card .t{font-family:var(--display);font-size:22px;font-weight:750;line-height:1.15;letter-spacing:-0.01em}
.card .d{font-size:14.5px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;background:var(--cobalt);color:var(--white)}
.price{font-family:var(--display);font-weight:800;font-size:20px}
.price small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted)}

.card.lead{background:var(--cobalt);color:var(--white)}
.card.lead .k{color:var(--highlight)}
.card.lead .d{color:rgba(255,255,255,.82)}
.card.lead .pill{background:var(--white);color:var(--cobalt)}
.badge{background:var(--highlight);color:var(--charcoal);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:999px;padding:4px 10px}

.list{display:flex;flex-direction:column;background:var(--white);border-radius:24px;overflow:hidden}
.list a{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.list a:last-child{border-bottom:0}
.list a:hover{background:var(--paper)}
.list .ic{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.list .ic svg{width:18px;height:18px;color:var(--charcoal)}
.list .nm{font-weight:600;flex:1;min-width:0}
.list .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.list .arr{color:var(--muted)}

.email{background:var(--white);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.email .addr{font-family:var(--display);font-weight:700;font-size:19px;word-break:break-all;user-select:all}
.email .btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1.5px solid var(--charcoal);background:transparent;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.solid{border:0;background:var(--cobalt);color:var(--white);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}

footer{background:var(--charcoal);color:var(--white);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px}
footer svg{width:130px;height:auto}
footer p{margin:0;font-size:13px;color:rgba(255,255,255,.7)}
footer .motto{font-weight:700;font-size:16px;color:var(--white)}
footer button{align-self:flex-start;background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--white);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--mono);letter-spacing:.5px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(34,34,34,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 6px}
.sheet h2{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;margin:0;letter-spacing:-0.01em}
.sheet p{margin:0;color:var(--muted)}
.x{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:14px;border:0;background:var(--white);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;font-size:16px;border:1.5px solid var(--rule);background:var(--white);border-radius:14px;padding:12px 14px;color:var(--charcoal);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cobalt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--white);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--white)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{border:1.5px solid var(--rule);background:var(--white);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:18px;color:var(--charcoal);font-family:var(--display)}
.day[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt);color:rgba(255,255,255,.8)}
.day[aria-pressed="true"] b{color:var(--white)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{border:1.5px solid var(--rule);background:var(--white);border-radius:12px;padding:10px;cursor:pointer;font-weight:600;font-size:14px}
.time[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt)}
.time:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.sum{background:var(--highlight);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sum b{font-family:var(--display)}
.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-block:10px}
.check{width:52px;height:52px;border-radius:50%;background:var(--cobalt);display:grid;place-items:center}
.check svg{width:26px;fill:none;stroke:var(--white);stroke-width:3}
.steps{display:flex;gap:6px;margin-right:48px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.steps i.on{background:var(--cobalt)}
.fine{font-size:12px;color:var(--muted)}

/* analytics */
.stats{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:14px}
.stat .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--cobalt);border-radius:4px}
.stat b{font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--charcoal);color:var(--white);border-radius:14px;padding:12px 16px;font-size:14px;z-index:60;max-width:calc(100% - 32px);transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast code{font-family:var(--mono);color:var(--highlight);font-size:12px}


.page.min{max-width:420px;padding-block:48px 32px;gap:32px;align-items:stretch}
.min .hero{align-items:center;text-align:center;gap:12px}
.min .portrait{width:104px;height:104px}
.min .portrait .ph{inset:8px 8px 0}
.min h1{font-size:26px;letter-spacing:-0.01em}
.min .bio{color:var(--muted);font-size:15px;margin:0 auto}
.links{display:flex;flex-direction:column;gap:12px}
.lnk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:14px 20px;border:0;border-radius:999px;background:var(--white);font-weight:600;font-size:16px;text-align:center;cursor:pointer;width:100%;transition:transform .15s}
.lnk:hover{transform:translateY(-2px)}
.lnk:active{transform:scale(.99)}
.lnk.lead{background:var(--cobalt);color:var(--white)}
.lnk .sub{font-weight:400;font-size:13px;color:var(--muted)}
.min .socials{justify-content:center;gap:4px}
.min .socials a{background:transparent;width:44px;height:44px}
.foot{display:flex;justify-content:center}
.foot svg{width:110px;height:auto;display:block}
.mockbar{justify-content:center}
.mockbar span{color:var(--white)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var toastEl=$('#toast'), tt;
  function toast(html){toastEl.innerHTML=html;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on')},2600)}

  // --- mock analytics
  var BASE={"Work directly with Arturo":38,"Book a consultation":61,"Skool community":142,"Instagram":96,"TikTok":71,"YouTube":54,"Facebook":12,"Email":19,"Website":8};
  var taps={};
  try{taps=JSON.parse(localStorage.getItem('sos-taps')||'{}')||{}}catch(e){taps={}}
  function track(n){if(!n)return;taps[n]=(taps[n]||0)+1;try{localStorage.setItem('sos-taps',JSON.stringify(taps))}catch(e){}}
  function renderStats(){
    var rows=Object.keys(BASE).map(function(k){return [k,BASE[k]+(taps[k]||0),taps[k]||0]}).sort(function(a,b){return b[1]-a[1]});
    var max=rows[0][1];
    $('#statList').innerHTML=rows.map(function(r){return '<div class="stat"><span>'+r[0]+(r[2]?' <span class="fine">(+'+r[2]+' you)</span>':'')+'</span><b>'+r[1]+'</b><span class="bar"><i style="width:'+(r[1]/max*100)+'%"></i></span></div>'}).join('');
  }

  // --- fake outbound links
  $$('[data-go]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();track(a.dataset.name);toast('Would open <code>'+a.dataset.go+'</code>')})});

  // --- sheets
  var scrim=$('#scrim'), open=null, lastFocus=null;
  function show(id){
    lastFocus=document.activeElement;
    open=$('#'+id);scrim.hidden=false;open.hidden=false;
    requestAnimationFrame(function(){scrim.classList.add('on');open.classList.add('on')});
    document.body.style.overflow='hidden';
    setTimeout(function(){var f=open.querySelector('input,button.chip,button.day,.x');if(f)f.focus()},300);
  }
  function hide(){
    if(!open)return;var el=open;open=null;
    el.classList.remove('on');scrim.classList.remove('on');document.body.style.overflow='';
    setTimeout(function(){el.hidden=true;scrim.hidden=true},280);
    if(lastFocus)lastFocus.focus();
  }
  scrim.addEventListener('click',hide);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
  $$('[data-close]').forEach(function(b){b.addEventListener('click',hide)});
  $$('[data-sheet]').forEach(function(b){b.addEventListener('click',function(){track(b.dataset.name);if(b.dataset.sheet==='apply')applyStep(0);else bookStep(0);show(b.dataset.sheet)})});
  
  $('#reset').addEventListener('click',function(){taps={};try{localStorage.removeItem('sos-taps')}catch(e){}renderStats()});

  function chipGroup(root,multi){$$('.chip',root).forEach(function(c){c.addEventListener('click',function(){if(!multi)$$('.chip',root).forEach(function(o){o.setAttribute('aria-pressed','false')});c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')==='true'?'false':'true')})})}

  // --- apply flow (3 steps)
  var app={};
  function steps(n){$$('#applySteps i').forEach(function(i,k){i.classList.toggle('on',k<=n)})}
  function applyStep(n){
    steps(n);var b=$('#applyBody');
    if(n===0){
      b.innerHTML='<form id="a0"><span class="eyebrow">Step 1 of 3 / About you</span><h2 id="applyT">Work directly with Arturo.</h2><p>A few quick questions so I know if we are a good fit. I read every one.</p>'+
      '<label class="f" for="aName">Your name<input id="aName" required autocomplete="name" value="Jordan Rivera"></label>'+
      '<label class="f" for="aEmail">Email<input id="aEmail" type="email" required autocomplete="email" value="jordan@example.com"></label>'+
      '<label class="f" for="aHandle">Main account (link or @handle)<input id="aHandle" value="@jordanmakes"></label>'+
      '<button class="solid" type="submit">Next</button></form>';
      $('#a0').addEventListener('submit',function(e){e.preventDefault();app.name=$('#aName').value.split(' ')[0];applyStep(1)});
    } else if(n===1){
      b.innerHTML='<form id="a1"><span class="eyebrow">Step 2 of 3 / Where you are</span><h2>What is the goal?</h2>'+
      '<div class="f" style="font-size:13px;font-weight:600">I want to...</div><div class="chips" id="goal"><button type="button" class="chip" aria-pressed="true">Grow my audience</button><button type="button" class="chip" aria-pressed="false">Get clients from content</button><button type="button" class="chip" aria-pressed="false">Post consistently</button><button type="button" class="chip" aria-pressed="false">Build a team system</button></div>'+
      '<label class="f" for="aStage">Where are you now?<select id="aStage"><option>Just starting (under 1K)</option><option selected>Growing (1K to 10K)</option><option>Established (10K to 100K)</option><option>Big account (100K+)</option></select></label>'+
      '<label class="f" for="aBlock">What is the biggest thing in your way?<textarea id="aBlock" rows="3">I post for a few weeks, then fall off. No system.</textarea></label>'+
      '<div style="display:flex;gap:8px"><button class="ghost" type="button" id="back1">Back</button><button class="solid" type="submit" style="flex:1">Next</button></div></form>';
      chipGroup($('#goal'),true);
      $('#back1').addEventListener('click',function(){applyStep(0)});
      $('#a1').addEventListener('submit',function(e){e.preventDefault();applyStep(2)});
    } else if(n===2){
      b.innerHTML='<form id="a2"><span class="eyebrow">Step 3 of 3 / Fit</span><h2>Ready to invest?</h2><p>1:1 coaching starts at $1,500/month for 12 weeks.</p>'+
      '<div class="chips" id="budget"><button type="button" class="chip" aria-pressed="false">Yes, ready now</button><button type="button" class="chip" aria-pressed="true">Yes, in 1 to 3 months</button><button type="button" class="chip" aria-pressed="false">Not yet</button></div>'+
      '<label class="f" for="aMore">Anything else I should know? (optional)<textarea id="aMore" rows="2"></textarea></label>'+
      '<div style="display:flex;gap:8px"><button class="ghost" type="button" id="back2">Back</button><button class="solid" type="submit" style="flex:1">Send application</button></div>'+
      '<span class="fine">Mockup: nothing is sent.</span></form>';
      chipGroup($('#budget'),false);
      $('#back2').addEventListener('click',function(){applyStep(1)});
      $('#a2').addEventListener('submit',function(e){e.preventDefault();applyStep(3)});
    } else {
      b.innerHTML='<div class="done"><div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><span class="eyebrow">Application received</span><h2>Thanks, '+(app.name||'friend')+'.</h2><p>I review applications every Monday. If it looks like a fit, you will get an email from me with a link to book an intro call.</p><button class="solid" type="button" data-close>Done</button><span class="fine">Mockup: no application was sent.</span></div>';
      $('[data-close]',b).addEventListener('click',hide);
    }
  }

  // --- booking flow
  var bk={};
  var DAYS=[['Tue',11],['Wed',12],['Thu',13],['Mon',17],['Tue',18]];
  var TIMES=['9:00 am','10:30 am','12:00 pm','2:00 pm','3:30 pm','5:00 pm'];
  function bookStep(n){
    var b=$('#bookBody');
    if(n===0){
      bk={d:2,t:null};
      b.innerHTML='<div class="grab"></div><span class="eyebrow">One-time consultation / 60 min</span><h2 id="bookT">Pick a time.</h2><p>Times in Pacific (Vancouver). November 2026.</p>'+
      '<div class="days" id="days">'+DAYS.map(function(d,i){return '<button type="button" class="day" aria-pressed="'+(i===bk.d)+'" data-i="'+i+'">'+d[0]+'<b>'+d[1]+'</b></button>'}).join('')+'</div>'+
      '<div class="times" id="times"></div>'+
      '<div class="sum"><span>60 min video call</span><b>$250 USD</b></div>'+
      '<button class="solid" type="button" id="toPay" disabled style="opacity:.5">Continue</button>';
      function renderTimes(){
        $('#times').innerHTML=TIMES.map(function(t,i){var off=((i+bk.d)%4===1);return '<button type="button" class="time" '+(off?'disabled':'')+' aria-pressed="'+(bk.t===i)+'" data-i="'+i+'">'+t+'</button>'}).join('');
        $$('#times .time').forEach(function(el){el.addEventListener('click',function(){bk.t=+el.dataset.i;renderTimes();var c=$('#toPay');c.disabled=false;c.style.opacity=1})});
      }
      $$('#days .day').forEach(function(el){el.addEventListener('click',function(){bk.d=+el.dataset.i;bk.t=null;$$('#days .day').forEach(function(o){o.setAttribute('aria-pressed',o===el)});var c=$('#toPay');c.disabled=true;c.style.opacity=.5;renderTimes()})});
      renderTimes();
      $('#toPay').addEventListener('click',function(){bookStep(1)});
    } else if(n===1){
      var d=DAYS[bk.d];
      b.innerHTML='<div class="grab"></div><span class="eyebrow">Confirm and pay</span><h2>'+d[0]+', Nov '+d[1]+' at '+TIMES[bk.t]+'.</h2>'+
      '<form id="pay"><label class="f" for="bName">Name<input id="bName" required autocomplete="name" value="Jordan Rivera"></label>'+
      '<label class="f" for="bEmail">Email<input id="bEmail" type="email" required autocomplete="email" value="jordan@example.com"></label>'+
      '<label class="f" for="bTopic">What do you want to cover?<textarea id="bTopic" rows="2">Audit my last 20 posts and help me plan next month.</textarea></label>'+
      '<label class="f" for="bCard">Card (sample checkout)<input id="bCard" inputmode="numeric" value="4242 4242 4242 4242"></label>'+
      '<div class="sum"><span>Total</span><b>$250 USD</b></div>'+
      '<div style="display:flex;gap:8px"><button class="ghost" type="button" id="bBack">Back</button><button class="solid" type="submit" style="flex:1">Pay and book</button></div>'+
      '<span class="fine">Mockup: no payment is taken. The real version would use Stripe through Cal.com or Calendly.</span></form>';
      $('#bBack').addEventListener('click',function(){var keep=bk;bookStep(0);bk=keep});
      $('#pay').addEventListener('submit',function(e){e.preventDefault();bk.name=$('#bName').value.split(' ')[0];bookStep(2)});
    } else {
      var d2=DAYS[bk.d];
      b.innerHTML='<div class="grab"></div><div class="done"><div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><span class="eyebrow">You are booked</span><h2>See you '+d2[0]+', Nov '+d2[1]+'.</h2><p>'+TIMES[bk.t]+' Pacific. A calendar invite and video link would land in your inbox.</p><button class="solid" type="button" data-close>Done</button><span class="fine">Mockup: nothing was booked.</span></div>';
      $('[data-close]',b).addEventListener('click',hide);
    }
  }

  // --- copy + share
  $('#copy').addEventListener('click',function(){
    track('Email');var t=$('#addr').textContent;
    var ok=function(){toast('Email copied')}, fail=function(){var r=document.createRange();r.selectNodeContents($('#addr'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Copy it from here.')};
    try{navigator.clipboard.writeText(t).then(ok,fail)}catch(e){fail()}
  });
  false&&$('#share').addEventListener('click',function(){
    var u='links.skoolofsocial.com';
    try{navigator.clipboard.writeText('https://'+u).then(function(){toast('Link copied: <code>'+u+'</code>')},function(){toast('Your link: <code>'+u+'</code>')})}catch(e){toast('Your link: <code>'+u+'</code>')}
  });
})();
</script>
